[project]
name = "repoindex"
version = "0.1.0"
description = "Local repository indexing and retrieval tool"
authors = [{name = "Marco Coppola"}]
requires-python = "==3.13"
dependencies = []

[project.scripts]
repoindex = "repoindex.cli:main"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = true