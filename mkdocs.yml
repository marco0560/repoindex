site_name: repoindex
site_description: Repository-local indexing and context retrieval for agent-assisted development
site_author: Marco Coppola

repo_name: repoindex
repo_url: https://github.com/marco0560/repoindex
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Contributing: CONTRIBUTING.md
  - Scripts: scripts.md
  - Release checklist: release/checklist.md
  - Release process: release/process.md
  - ADRs:
      - Index: adr/index.md
      - ADR-001: adr/ADR-001-rrf-multichannel.md
      - ADR-002: adr/ADR-002-prefix-filtering.md
      - ADR-003: adr/ADR-003-query-json-output.md
      - ADR-004: adr/ADR-004-pluggable-backends-migration-plan.md
