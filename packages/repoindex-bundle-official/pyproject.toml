[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoindex-bundle-official"
version = "2.0.0"
description = "Curated first-party plugin bundle for repoindex"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "repoindex[semantic]==2.0.0",
    "repoindex-analyzer-python==2.0.0",
    "repoindex-analyzer-json==2.0.0",
    "repoindex-analyzer-c==2.0.0",
    "repoindex-analyzer-bash==2.0.0",
    "repoindex-backend-sqlite==2.0.0",
]

[project.optional-dependencies]
test = [
    "black",
    "mypy",
    "pytest",
    "ruff",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
