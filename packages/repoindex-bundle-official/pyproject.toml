[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoindex-bundle-official"
version = "0.1.0"
description = "Curated first-party plugin bundle for repoindex"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "repoindex[semantic]",
    "repoindex-analyzer-python",
    "repoindex-analyzer-c",
    "repoindex-analyzer-bash",
]
